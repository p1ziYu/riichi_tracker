services:
  postgres:
    image: postgres:17-alpine
    container_name: riichi-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - riichi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riichi -d riichi"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  riichi-pgdata:
